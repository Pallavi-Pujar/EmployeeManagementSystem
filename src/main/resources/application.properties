spring.application.name=employee-management-system
server.port=8080

# MySQL on this computer listens on port 3307 (not the default 3306).
# createDatabaseIfNotExist creates employee_db the first time the app starts.
spring.datasource.url=jdbc:mysql://localhost:3307/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: Hibernate creates the employees table and adds missing columns.
# It does not delete existing rows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
server.error.include-stacktrace=never
